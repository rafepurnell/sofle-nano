# nice!view display
CONFIG_ZMK_DISPLAY=y
# Invert the nice!view status screen (light text on dark background)
CONFIG_NICE_VIEW_WIDGET_INVERTED=y

# RGB must stay off: no LEDs are fitted, and on the nice!nano the Sofle LED data pin (P0.06)
# is the same pin the nice!view adapter uses for the display's chip select
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Encoders (right one scrolls, which needs mouse support)
CONFIG_ZMK_POINTING=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth name (max 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="sofle-nano"

CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Read the battery every 10s (default 60s)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10
